# Limite de tentativas: o login é o único ponto de força bruta viável (os
# tokens públicos têm 256 bits), e o bcrypt custa CPU a cada tentativa.
# As zonas precisam viver no contexto http — este arquivo é incluído lá.
limit_req_zone $binary_remote_addr zone=tov_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tov_publico:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tov_api:10m rate=600r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança da SPA. O JWT fica em localStorage, então a CSP
    # é a principal defesa contra exfiltração de sessão por XSS. `always`
    # para valerem também em respostas de erro.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Sem 'unsafe-inline' em script: o Vite não injeta script inline. Estilos
    # inline são exigidos pelo MUI/emotion. Imagens data: e blob: cobrem o QR
    # code do WhatsApp e os PDFs abertos como blob.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self' blob:" always;

    # Comprime o bundle, estilos e respostas JSON encaminhadas pela API.
    # Fontes WOFF2 e imagens já são comprimidas em seus próprios formatos.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(?:sw\.js|sw\.mjs)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `^~` para que a location de regex das extensões acima nunca sombreie a
    # API: um endpoint futuro terminado em .js ou .png cairia em 404.
    location ^~ /api/auth/login {
        limit_req zone=tov_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O segredo do webhook da UazAPI viaja no caminho da URL: fora do access_log.
    location ^~ /api/whatsapp-publico/webhook/ {
        access_log off;
        proxy_pass http://backend:8000/whatsapp-publico/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    # Rotas públicas por token (extrato do aluno, totem de presença, agenda,
    # cadastro de professor): sem sessão, então com teto próprio.
    location ~ ^/api/(?:financeiro-aluno|presenca-publica|calendario-publico|cadastro-professor|acesso-professor)/ {
        limit_req zone=tov_publico burst=30 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        limit_req zone=tov_api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
