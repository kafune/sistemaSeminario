name: tov

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TOV_DB_PASSWORD:?defina TOV_DB_PASSWORD}
      MYSQL_DATABASE: tov
      MYSQL_USER: tov
      MYSQL_PASSWORD: ${TOV_DB_PASSWORD:?defina TOV_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TOV_DB_HOST: db
      TOV_DB_USER: tov
      TOV_DB_PASSWORD: ${TOV_DB_PASSWORD}
      TOV_DB_NAME: tov
      TOV_SECRET_KEY: ${TOV_SECRET_KEY:?defina TOV_SECRET_KEY}
      TOV_GOOGLE_FORMS_WEBHOOK_SECRET: ${TOV_GOOGLE_FORMS_WEBHOOK_SECRET:-}
      TOV_CORS_ORIGINS: ${TOV_CORS_ORIGINS:-http://localhost}
      TOV_UAZAPI_BASE_URL: ${TOV_UAZAPI_BASE_URL:-}
      TOV_UAZAPI_ADMIN_TOKEN: ${TOV_UAZAPI_ADMIN_TOKEN:-}
      TOV_WHATSAPP_DELAY_MIN: ${TOV_WHATSAPP_DELAY_MIN:-5}
      TOV_WHATSAPP_DELAY_MAX: ${TOV_WHATSAPP_DELAY_MAX:-15}
      TOV_WHATSAPP_UPLOAD_MAX_MB: ${TOV_WHATSAPP_UPLOAD_MAX_MB:-20}
      TOV_PUBLIC_API_URL: ${TOV_PUBLIC_API_URL:-}
      TOV_VAPID_PUBLIC_KEY: ${TOV_VAPID_PUBLIC_KEY:-}
      TOV_VAPID_PRIVATE_KEY: ${TOV_VAPID_PRIVATE_KEY:-}
      TOV_VAPID_SUBJECT: ${TOV_VAPID_SUBJECT:-}
      TOV_TIMEZONE: ${TOV_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TOV_HTTP_PORT:-8084}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
